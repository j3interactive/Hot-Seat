# Deploys the app to the dev App Service every time main changes.
# Sign-in is OpenID Connect to a managed identity that trusts only this repo's
# main branch, so there is no Azure password or secret stored in GitHub.
# One-time setup: run infra/setup-github-deploy.sh in Azure Cloud Shell.
name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC sign-in to Azure
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - name: Check setup
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME; do
            [ -n "$(printenv "VAR_$v")" ] || { echo "::error::Repository variable $v is missing. Run infra/setup-github-deploy.sh in Cloud Shell and add the values it prints."; exit 1; }
          done
        env:
          VAR_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VAR_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VAR_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          VAR_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VAR_AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanity checks
        run: |
          for f in server/*.js public/app.js; do node --check "$f"; done
          # The floor layout must be valid and db/seed.sql must match it.
          python3 tools/build_seed.py
          git diff --exit-code db/seed.sql || { echo "::error::db/seed.sql is out of date. Run python3 tools/build_seed.py and commit it."; exit 1; }

      - name: Package
        run: |
          echo "{\"commit\":\"${GITHUB_SHA}\"}" > version.json
          zip -qr hotseat.zip package.json package-lock.json version.json server public data db

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload
        # App Service runs npm install itself. That build can outlast the deploy
        # API's gateway (504), so upload asynchronously and judge by the health check.
        run: |
          az webapp deploy -g "$RG" -n "$APP" --src-path hotseat.zip --type zip --async true -o none \
            || echo "::warning::Upload reported an error; checking whether the new build comes up anyway."

      - name: Wait for the new build to go live
        run: |
          HOST=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          for i in $(seq 1 90); do
            LIVE=$(curl -fsS "https://$HOST/healthz" 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "Live: https://$HOST (commit ${GITHUB_SHA::7})"
              echo "### Deployed to https://$HOST (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The new build didn't come up within 15 minutes. Recent deployment log:"
          az webapp log deployment show -g "$RG" -n "$APP" --query "[].message" -o tsv 2>/dev/null | tail -20
          exit 1
